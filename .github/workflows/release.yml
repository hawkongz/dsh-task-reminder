name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # 建 GitHub Release 要写权限；发布 npm 走 OIDC（id-token），不需要 token。
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 发布前先跑全部自检：跨半侧契约 + 浏览器半侧 + 宿主半侧。
      # 走 npm test 而不是手写单条命令 —— 门禁与 package.json 只有一份真值，
      # 加了一套自检也不会漏（verify-host.mjs 就曾长期不在发布门里）。
      - run: npm test

      # tag 必须与 package.json 的 version 对上，否则手动 dispatch 会拿当前分支乱发。
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json v${version}"
            exit 1
          fi

      # 版本已在 registry 上就不再发布（重推 tag 不该弄红构建）；新版本才继续。
      - name: Is this version already published?
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${name}@${version} is already on the registry — nothing to publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # trusted publishing (OIDC)：无需 npm token、无需 OTP、无需手机确认。
      # 前提：npmjs.com 包设置里已配置 Trusted Publisher 指向本仓库与本文件名。
      # 没配置时这一步会以 ENEEDAUTH 失败，不会发错东西。
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: |
          set -o pipefail
          if npm publish --provenance 2>&1 | tee /tmp/npm-publish.log; then
            exit 0
          fi
          # registry 索引有传播延迟：上面那次探测可能没看到刚发布的版本，于是这里会撞上
          # “版本已存在”。那不是故障，跳过即可（v1.4.5 就踩过这一次）。
          if grep -q 'cannot publish over the previously published versions' /tmp/npm-publish.log; then
            echo "::notice::this version is already on the registry — nothing to publish"
            exit 0
          fi
          exit 1

      # npm 发完之后，用 CHANGELOG 里这一版的小节建 GitHub Release —— Releases 页不再靠手补。
      # 已有同名 release 就跳过（重推 tag 不会重复建）；CHANGELOG 里找不到小节时退回
      # GitHub 自动生成的说明，不因为文档漏写而弄红构建。
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already has a GitHub release — nothing to do."
            exit 0
          fi
          set +e
          VERSION="${version}" OUT="${RUNNER_TEMP}/release-notes.md" node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith("## [" + version + "]"));
            if (start === -1) process.exit(0);
            let end = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
            if (end === -1) end = lines.length;
            fs.writeFileSync(process.env.OUT, lines.slice(start + 1, end).join("\n").trim() + "\n");
          '
          set -e
          if [ -s "${RUNNER_TEMP}/release-notes.md" ]; then
            gh release create "${tag}" --title "${tag}" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag
          else
            echo "::notice::CHANGELOG.md 里没有 ${version} 的小节 —— 改用 GitHub 自动生成的说明"
            gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag
          fi
